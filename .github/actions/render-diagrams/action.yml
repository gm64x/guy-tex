name: Render Mermaid and PlantUML diagrams
description: Render repository diagram sources using pinned tool versions

inputs:
  diagrams-dir:
    description: Directory that receives rendered PNG files
    default: fontes/imagens/diagramas
  mermaid:
    description: Prepare Mermaid rendering
    default: "true"
  plantuml:
    description: Prepare PlantUML rendering
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Node.js
      if: inputs.mermaid == 'true'
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: "22"

    - name: Cache Mermaid packages
      if: inputs.mermaid == 'true'
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: ~/.npm
        key: mermaid-${{ runner.os }}-11
        restore-keys: mermaid-${{ runner.os }}-

    - name: Locate Chrome
      if: inputs.mermaid == 'true'
      shell: bash
      run: |
        browser="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
        test -n "$browser" || { echo "::error::Chrome is unavailable"; exit 1; }
        echo "PUPPETEER_EXECUTABLE_PATH=$browser" >> "$GITHUB_ENV"

    - name: Set up Java
      if: inputs.plantuml == 'true'
      uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
      with:
        distribution: temurin
        java-version: "17"

    - name: Render diagrams
      shell: bash
      env:
        MERMAID_CLI_VERSION: "11.12.0"
        PLANTUML_JAR_URL: https://github.com/plantuml/plantuml/releases/download/v1.2026.6/plantuml-1.2026.6.jar
        PLANTUML_JAR_SHA256: 89948f14c93756c7a3fb7b69078ff37e8489fd79dd430c582b931e2f65358690
      run: bash "${{ github.action_path }}/../../scripts/render_diagrams.sh" "${{ inputs.diagrams-dir }}" /dev/null
