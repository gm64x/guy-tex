name: Build LaTeX PDF
description: Compile a LaTeX project in a pinned container and export only its PDF

inputs:
  root-file:
    description: Root TeX file, relative to the repository
    default: main.tex
  output-dir:
    description: Directory that receives the compiled PDF
    default: .pdf
  output-name:
    description: Name of the exported PDF
    default: main.pdf
  pdf-version:
    description: PDF compatibility version passed to pdfTeX
    default: "7"
  cache-scope:
    description: GitHub Actions cache scope
    default: latex-build
  dockerfile:
    description: Optional Dockerfile path; defaults to the one bundled with this action
    default: ""
  force-build:
    description: Compile even when a PDF with the same repository hash is cached
    default: "false"

runs:
  using: composite
  steps:
    - name: Hash repository inputs
      id: repository-hash
      shell: bash
      run: |
        set -euo pipefail
        dockerfile_path="${{ inputs.dockerfile }}"
        if [ -z "$dockerfile_path" ]; then
          dockerfile_path="${{ github.action_path }}/../../../.config/infra/docker/Dockerfile"
        fi
        repository_hash="$({
          printf '%s\0' \
            "${{ inputs.root-file }}" \
            "${{ inputs.output-name }}" \
            "${{ inputs.pdf-version }}" \
            "$dockerfile_path"
          git ls-files -z | sort -z | xargs -0 sha256sum --
          sha256sum "$dockerfile_path"
        } | sha256sum | cut -d ' ' -f 1)"
        echo "hash=$repository_hash" >> "$GITHUB_OUTPUT"

    - name: Restore compiled PDF
      id: pdf-cache
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: ${{ inputs.output-dir }}/${{ inputs.output-name }}
        key: ${{ inputs.cache-scope }}-${{ runner.os }}-${{ steps.repository-hash.outputs.hash }}

    - name: Set up Docker Buildx
      if: inputs.force-build == 'true' || steps.pdf-cache.outputs.cache-hit != 'true'
      uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

    - name: Compile LaTeX
      if: inputs.force-build == 'true' || steps.pdf-cache.outputs.cache-hit != 'true'
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        context: .
        file: ${{ inputs.dockerfile || format('{0}/../../../.config/infra/docker/Dockerfile', github.action_path) }}
        push: false
        build-args: |
          LATEX_ROOT=${{ inputs.root-file }}
          OUTPUT_NAME=${{ inputs.output-name }}
          PDF_VERSION=${{ inputs.pdf-version }}
        outputs: type=local,dest=${{ inputs.output-dir }}
        cache-from: ${{ env.ACT == 'true' && '' || format('type=gha,scope={0}', inputs.cache-scope) }}
        cache-to: ${{ env.ACT == 'true' && '' || format('type=gha,mode=max,scope={0}', inputs.cache-scope) }}

    - name: Verify PDF
      shell: bash
      run: test -s "${{ inputs.output-dir }}/${{ inputs.output-name }}"
