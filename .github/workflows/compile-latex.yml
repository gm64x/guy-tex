name: Compile LaTeX to PDF

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    env:
      ROOT_TEX_OVERRIDE: "Template Latex - Relatorio Tecnico - IFSP - SBV.tex"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live (pdflatex)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended \
            texlive-fonts-extra texlive-bibtex-extra texlive-xetex latexmk

      - name: Find root .tex file (with debug and override)
        id: findroot
        run: |
          set -euo pipefail
          echo "Working dir: $(pwd)"
          echo "List top-level files:"
          ls -la
          echo "Searching for .tex files (debug list):"
          find . -type f -name "*.tex" -print || true

          # Allow overriding the root tex file via job env ROOT_TEX_OVERRIDE
          if [ -n "${ROOT_TEX_OVERRIDE:-}" ]; then
            echo "ROOT_TEX_OVERRIDE is set to: $ROOT_TEX_OVERRIDE"
            if [ -f "$ROOT_TEX_OVERRIDE" ]; then
              root_tex="$ROOT_TEX_OVERRIDE"
              echo "Using override: $root_tex"
            else
              # try to find by basename in repo (handles spaces)
              if find . -type f -name "$ROOT_TEX_OVERRIDE" | read; then
                root_tex=$(find . -type f -name "$ROOT_TEX_OVERRIDE" | head -n1)
                echo "Found override by name: $root_tex"
              else
                echo "Override specified but file not found: $ROOT_TEX_OVERRIDE"
                exit 1
              fi
            fi
          else
            # Auto-detect: Find the first .tex that contains \begin{document}
            root_tex=""
            while IFS= read -r -d '' file; do
              if grep -q "\\begin{document}" "$file"; then
                root_tex="$file"
                break
              fi
            done < <(find . -type f -name "*.tex" -print0)

            if [ -z "$root_tex" ]; then
              echo "No .tex file with \\begin{document} found."
              exit 1
            fi
          fi

          # Normalize path and output
          root_tex="${root_tex#./}"
          echo "root_tex=$root_tex" >> $GITHUB_OUTPUT
          echo "Found root tex: $root_tex"

      - name: Compile with pdflatex (multiple passes)
        env:
          ROOT_TEX: ${{ steps.findroot.outputs.root_tex }}
        run: |
          set -euo pipefail
          echo "Compiling $ROOT_TEX"
          # Run pdflatex/bibtex flow for references
          pdflatex -interaction=nonstopmode -halt-on-error "$ROOT_TEX"
          # If there is a .aux referencing bibtex, run bibtex
          auxfile="${ROOT_TEX%.tex}.aux"
          if [ -f "$auxfile" ] && grep -q "\\bibdata" "$auxfile" 2>/dev/null || grep -q "\\citation" "$auxfile" 2>/dev/null; then
            bibtex "${ROOT_TEX%.tex}"
          fi
          # Additional runs to resolve references
          pdflatex -interaction=nonstopmode -halt-on-error "$ROOT_TEX"
          pdflatex -interaction=nonstopmode -halt-on-error "$ROOT_TEX"

      - name: Upload generated PDF
        uses: actions/upload-artifact@v3
        with:
          name: compiled-pdfs
          path: "**/*.pdf"

      - name: Set PDF path
        id: pdfpath
        env:
          ROOT_TEX: ${{ steps.findroot.outputs.root_tex }}
        run: |
          set -euo pipefail
          pdf="${ROOT_TEX%.tex}.pdf"
          echo "pdf_path=$pdf" >> $GITHUB_OUTPUT
          echo "PDF will be uploaded to release: $pdf"

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: pdf-${{ github.run_number }}-${{ github.sha }}
          release_name: LaTeX PDF #${{ github.run_number }}
          body: Compiled PDF from LaTeX (generated by workflow)
          draft: false
          prerelease: false

      - name: Upload PDF to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.pdfpath.outputs.pdf_path }}
          asset_name: ${{ steps.pdfpath.outputs.pdf_path }}
          asset_content_type: application/pdf
