name: CI — Validate & Publish

env:
  DIAGRAMS_DIR: imagens/diagramas
  MERMAID_CLI_VERSION: "11"
  PLANTUML_JAR_URL: "https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar"

on:
  push:
    branches: [main, master]
    paths:
      - "**/*.mmd"
      - "**/*.plantuml"
      - "**/*.puml"
      - "**/*.uml"
      - "**/*.tex"
      - "**/*.bib"
      - "**/*.sty"
      - "**/*.cls"
      - ".github/workflows/ci.yml"
      - ".github/scripts/render_diagrams.sh"
  pull_request:
    paths:
      - "**/*.mmd"
      - "**/*.plantuml"
      - "**/*.puml"
      - "**/*.uml"
      - "**/*.tex"
      - "**/*.bib"
      - "**/*.sty"
      - "**/*.cls"
      - ".github/workflows/ci.yml"
      - ".github/scripts/render_diagrams.sh"
  workflow_dispatch:
    inputs:
      force_all:
        description: "Force all stages"
        type: boolean
        default: false
      force_publish:
        description: "Force Release creation"
        type: boolean
        default: false
      render_images_only:
        description: "Only render images and push them"
        type: boolean
        default: false

jobs:
  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      diagrams_changed: ${{ steps.detect.outputs.diagrams_changed }}
      plantuml_changed: ${{ steps.detect.outputs.plantuml_changed }}
      latex_changed: ${{ steps.detect.outputs.latex_changed }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --prune --depth=1 origin "${{ github.base_ref }}"
            git diff --name-only "origin/${{ github.base_ref }}...${{ github.sha }}" > changed-files.txt
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > changed-files.txt
          else
            git ls-files > changed-files.txt
          fi

          MERMAID=$(grep -Eq '\.mmd$' changed-files.txt && echo true || echo false)
          PLANTUML=$(grep -Eq '\.(plantuml|puml|uml)$' changed-files.txt && echo true || echo false)
          LATEX=$(grep -Eq '\.(tex|bib|sty|cls)$' changed-files.txt && echo true || echo false)
          CI_CONFIG=$(grep -Eq '^\.github/(workflows/ci\.yml|scripts/render_diagrams\.sh)$' changed-files.txt && echo true || echo false)
          RENDER_ALL=false

          if [[ "${{ inputs.force_all }}" == "true" || "$CI_CONFIG" == "true" ]]; then
            MERMAID=true; PLANTUML=true; LATEX=true
            RENDER_ALL=true
          fi
          if [[ "$LATEX" == "true" ]]; then
            MERMAID=true; PLANTUML=true
            RENDER_ALL=true
          fi
          if [[ "${{ inputs.render_images_only }}" == "true" ]]; then
            MERMAID=true; PLANTUML=true; LATEX=false
            RENDER_ALL=true
          fi
          if [[ "$RENDER_ALL" == "true" ]]; then
            : > changed-files.txt
          fi

          DIAGRAMS=false
          [[ "$MERMAID" == true || "$PLANTUML" == true ]] && DIAGRAMS=true
          echo "diagrams_changed=$DIAGRAMS" >> "$GITHUB_OUTPUT"
          echo "plantuml_changed=$PLANTUML" >> "$GITHUB_OUTPUT"
          echo "latex_changed=$LATEX" >> "$GITHUB_OUTPUT"
      - name: Publish change list
        uses: actions/upload-artifact@v4
        with:
          name: change-list
          path: changed-files.txt
          if-no-files-found: error

  diagrams:
    name: Render diagrams
    needs: detect
    if: needs.detect.outputs.diagrams_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download change list
        uses: actions/download-artifact@v4
        with:
          name: change-list
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Chrome for Mermaid
        run: |
          set -euo pipefail
          npx --yes @puppeteer/browsers@latest install chrome-headless-shell@148.0.7778.97
          BROWSER_PATH="$(find "$GITHUB_WORKSPACE" "$HOME/.cache/puppeteer" -type f \( -name chrome-headless-shell -o -name chrome \) 2>/dev/null | head -n 1 || true)"
          test -n "$BROWSER_PATH" || { echo "::error::Chrome binary not found"; exit 1; }
          echo "PUPPETEER_EXECUTABLE_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"
      - name: Setup Java
        if: needs.detect.outputs.plantuml_changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Graphviz
        if: needs.detect.outputs.plantuml_changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          echo "GRAPHVIZ_DOT=$(command -v dot)" >> "$GITHUB_ENV"
      - name: Render diagram images
        run: |
          chmod +x .github/scripts/render_diagrams.sh
          ./.github/scripts/render_diagrams.sh "$DIAGRAMS_DIR" changed-files.txt
      - name: Upload rendered diagrams
        uses: actions/upload-artifact@v4
        with:
          name: rendered-diagrams
          path: ${{ env.DIAGRAMS_DIR }}/*.png
          if-no-files-found: error
      - name: Commit rendered diagrams
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$DIAGRAMS_DIR"/*.png || true
          if ! git diff --staged --quiet && [[ "$(git log -1 --pretty=%an)" != *"github-actions"* ]]; then
            git commit -m "chore: auto-render diagrams [skip ci]"
            git push
          fi

  latex:
    name: Compile LaTeX
    needs: [detect, diagrams]
    if: ${{ always() && needs.detect.outputs.latex_changed == 'true' && (needs.diagrams.result == 'success' || needs.diagrams.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Download rendered diagrams
        if: needs.diagrams.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: rendered-diagrams
          path: ${{ env.DIAGRAMS_DIR }}
      - name: Compile document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          args: "-pdf -interaction=nonstopmode -halt-on-error"
      - name: Stage compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: latex-output
          path: main.pdf
          if-no-files-found: error

  artifact:
    name: Publish PDF artifact
    needs: [detect, latex]
    if: ${{ always() && needs.detect.outputs.latex_changed == 'true' && needs.latex.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Download compiled PDF
        uses: actions/download-artifact@v4
        with:
          name: latex-output
          path: artifact
      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: compiled-thesis
          path: artifact/main.pdf
          if-no-files-found: error

  release:
    name: Create release
    needs: [detect, artifact]
    if: ${{ always() && needs.detect.outputs.latex_changed == 'true' && needs.artifact.result == 'success' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || inputs.force_publish == true) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release PDF artifact
        uses: actions/download-artifact@v4
        with:
          name: compiled-thesis
          path: release
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Release ${{ github.run_number }}
          files: release/main.pdf
          generate_release_notes: true
          fail_on_unmatched_files: true
