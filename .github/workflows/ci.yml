name: CI — Build & Release

env:
  DIAGRAMS_DIR: imagens/diagrams
  MERMAID_CLI_VERSION: "11"
  PLANTUML_JAR_URL: "https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar"

on:
  push:
    branches: [main, master]
    paths:
      - "**/*.mmd"
      - "**/*.plantuml"
      - "**/*.puml"
      - "**/*.uml"
      - "**/*.tex"
      - "**/*.bib"
      - "**/*.sty"
      - "**/*.cls"
      - ".github/workflows/ci.yml"
      - ".github/scripts/render_diagrams.sh"
  pull_request:
    paths:
      - "**/*.mmd"
      - "**/*.plantuml"
      - "**/*.puml"
      - "**/*.uml"
      - "**/*.tex"
      - ".github/workflows/ci.yml"
      - ".github/scripts/render_diagrams.sh"
  workflow_dispatch:
    inputs:
      force_all:
        description: "Force all stages"
        type: boolean
        default: false
      force_publish:
        description: "Force Release creation"
        type: boolean
        default: false
      render_images_only:
        description: "Only render images and push them"
        type: boolean
        default: false

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Changes
        id: detect
        run: |
          set -euo pipefail
          echo "::group::Change Detection"

          CHANGED=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --prune --depth=1 origin "${{ github.base_ref }}"
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...${{ github.sha }})
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          else
            CHANGED=$(git ls-files)
          fi

          echo "$CHANGED" > .changed_files_list

          # Detect diagram types and LaTeX changes
          MERMAID=$(grep -Eq "\.mmd$" .changed_files_list && echo "true" || echo "false")
          PLANTUML=$(grep -Eq "\.(plantuml|puml|uml)$" .changed_files_list && echo "true" || echo "false")
          LATEX=$(grep -Eq "\.(tex|bib|sty|cls)$" .changed_files_list && echo "true" || echo "false")
          RENDER_ALL_DIAGRAMS="false"
          CI_CONFIG=$(grep -Eq "^\.github/(workflows/ci\.yml|scripts/render_diagrams\.sh)$" .changed_files_list && echo "true" || echo "false")

          if [[ "${{ inputs.force_all }}" == "true" ]]; then
            MERMAID="true"
            PLANTUML="true"
            LATEX="true"
            RENDER_ALL_DIAGRAMS="true"
          fi

          if [[ "$CI_CONFIG" == "true" ]]; then
            echo "CI workflow/script changed; forcing all stages."
            MERMAID="true"
            PLANTUML="true"
            LATEX="true"
            RENDER_ALL_DIAGRAMS="true"
          fi

          if [[ "$LATEX" == "true" ]]; then
            MERMAID="true"
            PLANTUML="true"
            RENDER_ALL_DIAGRAMS="true"
          fi

          # If manually dispatched to only render images, force diagram rendering and
          # clear the changed-files list so the renderer will scan the repo for all diagrams.
          if [[ "${{ inputs.render_images_only }}" == "true" ]]; then
            MERMAID="true"
            PLANTUML="true"
            LATEX="false"
            RENDER_ALL_DIAGRAMS="true"
          fi

          if [[ "$RENDER_ALL_DIAGRAMS" == "true" ]]; then
            echo "" > .changed_files_list
          fi

          DIAGRAMS="false"
          if [ "$MERMAID" = "true" ] || [ "$PLANTUML" = "true" ]; then
            DIAGRAMS="true"
          fi

          echo "mermaid_changed=$MERMAID" >> $GITHUB_OUTPUT
          echo "plantuml_changed=$PLANTUML" >> $GITHUB_OUTPUT
          echo "diagrams_changed=$DIAGRAMS" >> $GITHUB_OUTPUT
          echo "latex_changed=$LATEX" >> $GITHUB_OUTPUT
          echo "Found: Mermaid=$MERMAID, PlantUML=$PLANTUML, LaTeX=$LATEX, Diagrams=$DIAGRAMS"
          echo "::endgroup::"

      - name: Setup Node.js
        if: steps.detect.outputs.mermaid_changed == 'true' || inputs.render_images_only == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Chrome for Mermaid
        if: steps.detect.outputs.mermaid_changed == 'true' || inputs.render_images_only == 'true'
        run: |
          npx --yes @puppeteer/browsers@latest install chrome@148.0.7778.97

      - name: Setup Java
        if: steps.detect.outputs.plantuml_changed == 'true' || inputs.render_images_only == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Graphviz
        if: steps.detect.outputs.plantuml_changed == 'true' || inputs.render_images_only == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          echo "GRAPHVIZ_DOT=$(command -v dot)" >> $GITHUB_ENV
          dot -V

      - name: Render Diagrams
        if: steps.detect.outputs.diagrams_changed == 'true' || inputs.render_images_only == 'true'
        run: |
          chmod +x .github/scripts/render_diagrams.sh
          ./.github/scripts/render_diagrams.sh "$DIAGRAMS_DIR" .changed_files_list

      - name: Commit Diagrams
        if: (steps.detect.outputs.diagrams_changed == 'true' || inputs.render_images_only == 'true') && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$DIAGRAMS_DIR"/*.png || true

          if ! git diff --staged --quiet; then
            # Loop protection
            if [[ "$(git log -1 --pretty=%an)" != *"github-actions"* ]]; then
              git commit -m "chore: auto-render diagrams [skip ci]"
              git push
            fi
          fi

      - name: Find Root TeX
        id: findroot
        if: steps.detect.outputs.latex_changed == 'true'
        run: |
          echo "::group::Root Discovery"
          if ls "Template Latex - Relatorio Tecnico - IFSP - SBV.tex" >/dev/null 2>&1; then
            ORIGINAL="Template Latex - Relatorio Tecnico - IFSP - SBV.tex"
          else
            ORIGINAL=$(grep -l "\\begin{document}" *.tex | head -n 1 || echo "")
          fi

          if [ -z "$ORIGINAL" ]; then
            echo "::error::No root LaTeX file found!"
            exit 1
          fi

          # Create a symlink without spaces to avoid issues with docker-based actions
          ln -sf "$ORIGINAL" main.tex
          echo "root_tex=main.tex" >> $GITHUB_OUTPUT
          echo "Using: $ORIGINAL (linked to main.tex)"
          echo "::endgroup::"

      - name: Compile LaTeX
        if: steps.findroot.outputs.root_tex != '' && steps.detect.outputs.latex_changed == 'true'
        uses: xu-cheng/latex-action@v3
        with:
          root_file: ${{ steps.findroot.outputs.root_tex }}
          args: "-pdf -interaction=nonstopmode -halt-on-error"

      - name: Upload PDF
        if: steps.detect.outputs.latex_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: compiled-thesis
          path: main.pdf
          if-no-files-found: error

      - name: Create Release
        if: |
          success() &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || inputs.force_publish == true) &&
          steps.detect.outputs.latex_changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Release ${{ github.run_number }}
          files: main.pdf
          generate_release_notes: true
          fail_on_unmatched_files: true
