name: Build document

on:
  push:
    branches: [main, master]
    paths:
      - "**/*.tex"
      - "**/*.bib"
      - "**/*.sty"
      - "**/*.cls"
      - "**/*.mmd"
      - "**/*.plantuml"
      - "**/*.puml"
      - "**/*.uml"
      - "fontes/imagens/**"
      - "pretextuais/institucionais/*.pdf"
      - ".config/infra/docker/Dockerfile*"
      - ".github/actions/**"
      - ".github/scripts/render_diagrams.sh"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "**/*.tex"
      - "**/*.bib"
      - "**/*.sty"
      - "**/*.cls"
      - "**/*.mmd"
      - "**/*.plantuml"
      - "**/*.puml"
      - "**/*.uml"
      - "fontes/imagens/**"
      - "pretextuais/institucionais/*.pdf"
      - ".config/infra/docker/Dockerfile*"
      - ".github/actions/**"
      - ".github/scripts/render_diagrams.sh"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      force_all:
        description: Render diagrams and compile the document
        type: boolean
        default: false
      force_publish:
        description: Publish the compiled PDF as a release
        type: boolean
        default: false
      render_images_only:
        description: Render and commit diagrams without compiling
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DIAGRAMS_DIR: fontes/imagens/diagramas

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      diagrams: ${{ steps.paths.outputs.diagrams == 'true' || steps.paths.outputs.rendering == 'true' || inputs.force_all || inputs.render_images_only }}
      mermaid: ${{ steps.paths.outputs.diagrams == 'true' || steps.paths.outputs.rendering == 'true' || inputs.force_all || inputs.render_images_only }}
      plantuml: ${{ steps.paths.outputs.diagrams == 'true' || steps.paths.outputs.rendering == 'true' || inputs.force_all || inputs.render_images_only }}
      latex: ${{ !inputs.render_images_only && (steps.paths.outputs.latex == 'true' || steps.paths.outputs.diagrams == 'true' || steps.paths.outputs.rendering == 'true' || steps.paths.outputs.build == 'true' || inputs.force_all) }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - id: paths
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            diagrams:
              - '**/*.mmd'
              - '**/*.plantuml'
              - '**/*.puml'
              - '**/*.uml'
            rendering:
              - '.github/actions/render-diagrams/**'
              - '.github/scripts/render_diagrams.sh'
            build:
              - '.config/infra/docker/Dockerfile*'
              - '.github/actions/build-latex/**'
              - '.github/workflows/ci.yml'
            latex:
              - '**/*.tex'
              - '**/*.bib'
              - '**/*.sty'
              - '**/*.cls'
              - 'fontes/imagens/**'
              - 'pretextuais/institucionais/*.pdf'

  diagrams:
    needs: changes
    if: needs.changes.outputs.diagrams == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/render-diagrams
        with:
          diagrams-dir: ${{ env.DIAGRAMS_DIR }}
          mermaid: ${{ needs.changes.outputs.mermaid }}
          plantuml: ${{ needs.changes.outputs.plantuml }}
          force-all: ${{ inputs.force_all || inputs.render_images_only }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rendered-diagrams
          path: ${{ env.DIAGRAMS_DIR }}/*.png
          if-no-files-found: error
          retention-days: 1
      - name: Commit rendered diagrams
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only generated diagram PNGs are allowed in this commit. PDFs and
          # every build directory remain local/intermediate release data.
          git add -A -- "$DIAGRAMS_DIR"
          if git diff --staged --name-only | grep -Eq '(^|/)\.pdf(/|$)'; then
            echo "::error::Build output was staged; refusing to commit it"
            git reset
            exit 1
          fi
          git diff --staged --quiet && exit 0
          git commit -m "chore: render diagrams [skip ci]"
          git push

  latex:
    needs: [changes, diagrams]
    if: always() && needs.changes.outputs.latex == 'true' && contains(fromJSON('["success","skipped"]'), needs.diagrams.result)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - if: needs.diagrams.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rendered-diagrams
          path: ${{ env.DIAGRAMS_DIR }}
      - uses: ./.github/actions/build-latex
        with:
          output-dir: .pdf
          force-build: ${{ inputs.force_all }}
      - name: Attach PDF to release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || inputs.force_publish
        uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe # v2.4.2
        with:
          tag_name: build-${{ github.run_number }}
          name: Release ${{ github.run_number }}
          files: .pdf/main.pdf
          generate_release_notes: true
          fail_on_unmatched_files: true
