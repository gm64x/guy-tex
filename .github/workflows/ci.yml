name: CI — Validate & Publish

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DIAGRAMS_DIR: imagens/diagramas
  MERMAID_CLI_VERSION: "11"
  PLANTUML_JAR_URL: "https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar"

on:
  push:
    branches: [main, master]
    paths:
      - "**/*.mmd"
      - "**/*.plantuml"
      - "**/*.puml"
      - "**/*.uml"
      - "**/*.tex"
      - "**/*.bib"
      - "**/*.sty"
      - "**/*.cls"
      - "pretextuais/institucionais/*.pdf"
      - ".github/workflows/ci.yml"
      - ".github/scripts/render_diagrams.sh"
  pull_request:
    paths:
      - "**/*.mmd"
      - "**/*.plantuml"
      - "**/*.puml"
      - "**/*.uml"
      - "**/*.tex"
      - "**/*.bib"
      - "**/*.sty"
      - "**/*.cls"
      - "pretextuais/institucionais/*.pdf"
      - ".github/workflows/ci.yml"
      - ".github/scripts/render_diagrams.sh"
  workflow_dispatch:
    inputs:
      force_all:
        description: "Force all stages"
        type: boolean
        default: false
      force_publish:
        description: "Force Release creation"
        type: boolean
        default: false
      render_images_only:
        description: "Only render images and push them"
        type: boolean
        default: false

jobs:
  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      diagrams_changed: ${{ steps.detect.outputs.diagrams_changed }}
      plantuml_changed: ${{ steps.detect.outputs.plantuml_changed }}
      mermaid_changed: ${{ steps.detect.outputs.mermaid_changed }}
      latex_changed: ${{ steps.detect.outputs.latex_changed }}
      compile_needed: ${{ steps.detect.outputs.compile_needed }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --prune --depth=1 origin "${{ github.base_ref }}"
            git diff --name-only "origin/${{ github.base_ref }}...${{ github.sha }}" > changed-files.txt
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > changed-files.txt
          else
            git ls-files > changed-files.txt
          fi

          MERMAID=$(grep -Eq '\.mmd$' changed-files.txt && echo true || echo false)
          PLANTUML=$(grep -Eq '\.(plantuml|puml|uml)$' changed-files.txt && echo true || echo false)
          LATEX=$(grep -Eq '\.(tex|bib|sty|cls)$|^pretextuais/institucionais/.*\.pdf$' changed-files.txt && echo true || echo false)
          CI_CONFIG=$(grep -Eq '^\.github/(workflows/ci\.yml|scripts/render_diagrams\.sh)$' changed-files.txt && echo true || echo false)
          RENDER_ALL=false

          if [[ "${{ inputs.force_all }}" == "true" || "$CI_CONFIG" == "true" ]]; then
            MERMAID=true; PLANTUML=true; LATEX=true
            RENDER_ALL=true
          fi
          if [[ "${{ inputs.render_images_only }}" == "true" ]]; then
            MERMAID=true; PLANTUML=true; LATEX=false
            RENDER_ALL=true
          fi
          if [[ "$RENDER_ALL" == "true" ]]; then
            : > changed-files.txt
          fi

          DIAGRAMS=false
          [[ "$MERMAID" == true || "$PLANTUML" == true ]] && DIAGRAMS=true

          COMPILE=false
          if [[ "${{ inputs.render_images_only }}" != "true" ]] && \
             [[ "$LATEX" == true || "$DIAGRAMS" == true ]]; then
            COMPILE=true
          fi

          echo "diagrams_changed=$DIAGRAMS" >> "$GITHUB_OUTPUT"
          echo "mermaid_changed=$MERMAID" >> "$GITHUB_OUTPUT"
          echo "plantuml_changed=$PLANTUML" >> "$GITHUB_OUTPUT"
          echo "latex_changed=$LATEX" >> "$GITHUB_OUTPUT"
          echo "compile_needed=$COMPILE" >> "$GITHUB_OUTPUT"
      - name: Publish change list
        uses: actions/upload-artifact@v4
        with:
          name: change-list
          path: changed-files.txt
          if-no-files-found: error
          retention-days: 1

  diagrams:
    name: Render diagrams
    needs: detect
    if: needs.detect.outputs.diagrams_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download change list
        uses: actions/download-artifact@v4
        with:
          name: change-list
      - name: Setup Node.js
        if: needs.detect.outputs.mermaid_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cache Mermaid packages
        if: needs.detect.outputs.mermaid_changed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: mermaid-${{ runner.os }}-${{ env.MERMAID_CLI_VERSION }}
          restore-keys: mermaid-${{ runner.os }}-
      - name: Locate Chrome for Mermaid
        if: needs.detect.outputs.mermaid_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BROWSER_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [[ -z "$BROWSER_PATH" ]]; then
            npx --yes @puppeteer/browsers@latest install chrome-headless-shell@stable
            BROWSER_PATH="$(find "$HOME/.cache/puppeteer" -type f -name chrome-headless-shell -print -quit 2>/dev/null || true)"
          fi
          test -n "$BROWSER_PATH" || { echo "::error::Chrome is not available on the runner"; exit 1; }
          echo "PUPPETEER_EXECUTABLE_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"
      - name: Setup Java
        if: needs.detect.outputs.plantuml_changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Graphviz
        if: needs.detect.outputs.plantuml_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v dot >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends graphviz
          fi
          echo "GRAPHVIZ_DOT=$(command -v dot)" >> "$GITHUB_ENV"
      - name: Render diagram images
        run: |
          chmod +x .github/scripts/render_diagrams.sh
          ./.github/scripts/render_diagrams.sh "$DIAGRAMS_DIR" changed-files.txt
      - name: Upload rendered diagrams
        uses: actions/upload-artifact@v4
        with:
          name: rendered-diagrams
          path: ${{ env.DIAGRAMS_DIR }}/*.png
          if-no-files-found: error
          retention-days: 1
      - name: Commit rendered diagrams
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$DIAGRAMS_DIR"/*.png || true
          if ! git diff --staged --quiet && [[ "$(git log -1 --pretty=%an)" != *"github-actions"* ]]; then
            git commit -m "chore: auto-render diagrams [skip ci]"
            git push
          fi

  latex:
    name: Compile LaTeX
    needs: [detect, diagrams]
    if: ${{ always() && needs.detect.outputs.compile_needed == 'true' && (needs.diagrams.result == 'success' || needs.diagrams.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Download rendered diagrams
        if: needs.diagrams.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: rendered-diagrams
          path: ${{ env.DIAGRAMS_DIR }}
      - name: Compile document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          args: "-pdf -interaction=nonstopmode -halt-on-error"
      - name: Upload compilation diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: latex-diagnostics
          path: |
            main.aux
            main.blg
            main.log
            main.toc
          if-no-files-found: warn
          retention-days: 7
      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: compiled-thesis
          path: main.pdf
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create release
    needs: [detect, latex]
    if: ${{ always() && needs.detect.outputs.compile_needed == 'true' && needs.latex.result == 'success' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || inputs.force_publish == true) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release PDF artifact
        uses: actions/download-artifact@v4
        with:
          name: compiled-thesis
          path: release
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Release ${{ github.run_number }}
          files: release/main.pdf
          generate_release_notes: true
          fail_on_unmatched_files: true
