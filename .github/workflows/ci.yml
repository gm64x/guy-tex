name: CI — Build & Release

env:
  DIAGRAMS_DIR: imagens/diagrams
  MERMAID_CLI_VERSION: "9"

on:
  push:
    branches: [main, master]
    paths:
      - "**/*.mmd"
      - "**/*.tex"
      - "**/*.bib"
      - "**/*.sty"
      - "**/*.cls"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "**/*.mmd"
      - "**/*.tex"
  workflow_dispatch:
    inputs:
      force_all:
        description: "Force all stages"
        type: boolean
        default: false
      force_publish:
        description: "Force Release creation"
        type: boolean
        default: false

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Changes
        id: detect
        run: |
          set -euo pipefail
          echo "::group::Change Detection"

          CHANGED=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --prune --depth=1 origin "${{ github.base_ref }}"
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...${{ github.sha }})
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          else
            CHANGED=$(git ls-files)
          fi

          echo "$CHANGED" > .changed_files_list

          MERMAID=$(grep -q "\.mmd\b" .changed_files_list && echo "true" || echo "false")
          LATEX=$(grep -E "\.(tex|bib|sty|cls)\b" .changed_files_list && echo "true" || echo "false")

          [[ "${{ inputs.force_all }}" == "true" ]] && { MERMAID="true"; LATEX="true"; }

          echo "mermaid_changed=$MERMAID" >> $GITHUB_OUTPUT
          echo "latex_changed=$LATEX" >> $GITHUB_OUTPUT
          echo "Found: Mermaid=$MERMAID, LaTeX=$LATEX"
          echo "::endgroup::"

      - name: Setup Node.js
        if: steps.detect.outputs.mermaid_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Render Diagrams
        if: steps.detect.outputs.mermaid_changed == 'true'
        run: |
          chmod +x .github/scripts/render_diagrams.sh
          ./.github/scripts/render_diagrams.sh "$DIAGRAMS_DIR" .changed_files_list

      - name: Commit Diagrams
        if: steps.detect.outputs.mermaid_changed == 'true' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$DIAGRAMS_DIR"/*.png || true

          if ! git diff --staged --quiet; then
            # Loop protection
            if [[ "$(git log -1 --pretty=%an)" != *"github-actions"* ]]; then
              git commit -m "chore: auto-render diagrams [skip ci]"
              git push
            fi
          fi

      - name: Find Root TeX
        id: findroot
        if: steps.detect.outputs.latex_changed == 'true'
        run: |
          echo "::group::Root Discovery"
          # Priority: 1. Template name, 2. Manual override, 3. \begin{document}
          ROOT=""
          if ls "Template Latex - Relatorio Tecnico - IFSP - SBV.tex" >/dev/null 2>&1; then
            ROOT="Template Latex - Relatorio Tecnico - IFSP - SBV.tex"
          else
            ROOT=$(grep -l "\\begin{document}" *.tex | head -n 1 || echo "")
          fi

          if [ -z "$ROOT" ]; then
            echo "::error::No root LaTeX file found!"
            exit 1
          fi
          echo "root_tex=$ROOT" >> $GITHUB_OUTPUT
          echo "Using: $ROOT"
          echo "::endgroup::"

      - name: Compile LaTeX
        if: steps.detect.outputs.latex_changed == 'true'
        uses: xu-cheng/latex-action@v3
        with:
          root_file: ${{ steps.findroot.outputs.root_tex }}
          args: "-pdf -interaction=nonstopmode -halt-on-error"

      - name: Upload PDF
        if: steps.detect.outputs.latex_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: compiled-thesis
          path: "*.pdf"
          if-no-files-found: error

      - name: Create Release
        if: |
          success() &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || inputs.force_publish == true) &&
          steps.detect.outputs.latex_changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Release ${{ github.run_number }}
          files: "*.pdf"
          generate_release_notes: true
          fail_on_unmatched_files: true
