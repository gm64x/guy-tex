name: Render Mermaid diagrams and test LaTeX build

on:
  push:
    paths:
      - "**/*.mmd"
      - "**/*.tex"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install mermaid-cli
        run: |
          npm install -g @mermaid-js/mermaid-cli@9

      - name: Render .mmd -> PNG (output to imagens/)
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p imagens
          echo "Rendering Mermaid files to PNG in imagens/"
          for f in $(git ls-files '*.mmd'); do
            base=$(basename "$f" .mmd)
            out="imagens/${base}.png"
            echo "Rendering $f -> $out"
            npx -y @mermaid-js/mermaid-cli -i "$f" -o "$out" || npx -y @mermaid-js/mermaid-cli -i "$f" -o "$out" --quiet
          done

      - name: Commit rendered PNGs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add imagens/*.png || true
          if git diff --staged --quiet; then
            echo "No diagram PNGs to commit"
          else
            git commit -m "chore: render mermaid diagrams to PNG"
            git push
          fi

      - name: Install TeX Live (full) to test compilation
        if: always()
        run: |
          sudo apt-get update
          # texlive-full is large but ensures packages like abntex2 are present
          sudo apt-get install -y texlive-full texlive-lang-portuguese latexmk

      - name: Build LaTeX document (tests compilation)
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          echo "Attempting to compile LaTeX document"
          # Use latexmk for robust compilation; adjust filename if needed
          FILE="Template Latex - Relatorio Tecnico - IFSP - SBV.tex"
          if [ -f "$FILE" ]; then
            latexmk -pdf -pdflatex='pdflatex -interaction=nonstopmode' -silent "$FILE" || true
          else
            echo "Main TeX file not found: $FILE"
          fi

      - name: Upload compiled PDF (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-latex
          path: |
            Template Latex - Relatorio Tecnico - IFSP - SBV.pdf
            *.pdf
